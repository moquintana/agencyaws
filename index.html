
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>

      inset: 0;

      }

    .text-outline {
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
      color: transparent;
    }
    section {
      position: relative;
    }
  </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "framer-motion": "https://esm.sh/framer-motion@12.0.0",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';

    // --- Component: Navbar ---
    const Navbar = () => {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 50);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <motion.nav
          initial={{ y: -100 }}
          animate={{ y: 0 }}
          transition={{ duration: 0.8 }}
          className={`fixed top-0 left-0 w-full z-50 transition-all duration-500 px-8 md:px-24 py-8 ${scrolled ? 'bg-black/80 backdrop-blur-md py-6' : 'bg-transparent'}`}
        >
          <div className="max-w-screen-2xl mx-auto flex justify-between items-center">
            <div className="flex flex-col">
              <span className="text-xl font-black tracking-[0.5em] uppercase">Aether</span>
              <span className="text-[0.5rem] tracking-[0.8em] uppercase text-stone-500">Intelligence Agency</span>
            </div>
            <div className="hidden md:flex gap-12">
              {['Perspective', 'Couture', 'Intelligence', 'Dialogue'].map(item => (
                <a key={item} href="#" className="text-[0.6rem] uppercase tracking-[0.4em] text-stone-400 hover:text-white transition-colors">{item}</a>
              ))}
            </div>
            <button className="text-[0.6rem] uppercase tracking-[0.4em] border border-white/20 px-6 py-2 hover:bg-white hover:text-black transition-all">
              Inquire
            </button>
          </div>
        </motion.nav>
      );
    };

    // --- Component: Hero ---
    const Hero = () => (
      <section className="relative h-screen flex items-center justify-center bg-black overflow-hidden">
        <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2000')] bg-cover bg-center opacity-40 grayscale" style={{ filter: 'sepia(0.2) brightness(0.5)' }}></div>
        <div className="relative z-10 text-center">
          <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 1 }}>
            <span className="text-[0.6rem] uppercase tracking-[1.5em] text-stone-500 mb-8 block">Neural Architecture</span>
            <h1 className="text-6xl md:text-[10rem] font-black tracking-[0.2em] leading-none uppercase text-white">AETHER</h1>
            <h2 className="text-3xl md:text-6xl font-light tracking-[0.5em] uppercase text-stone-500 -mt-4 italic">Intelligence</h2>
          </motion.div>
        </div>
      </section>
    );

    // --- Component: PortfolioSection ---
    const PortfolioSection = ({ title, subtitle, imageUrl, reversed }) => (
      <section className="relative h-screen w-full overflow-hidden flex flex-col justify-end p-8 md:p-24 group">
        <div 
          className="absolute inset-0 bg-cover bg-center transition-transform duration-[5s] scale-105 group-hover:scale-100 grayscale brightness-50"
          style={{ backgroundImage: `url('${imageUrl}')`, filter: 'sepia(0.1) brightness(0.4)' }}
        ></div>
        <div className={`relative z-10 max-w-2xl ${reversed ? 'ml-auto text-right' : ''}`}>
          <motion.div initial={{ opacity: 0, y: 30 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 1 }}>
            <h3 className="text-4xl md:text-7xl font-black uppercase tracking-widest mb-4">{title}</h3>
            <p className="text-stone-400 tracking-[0.2em] uppercase text-sm font-light">{subtitle}</p>
          </motion.div>
        </div>
      </section>
    );

    // --- Component: AboutSection ---
    const AboutSection = () => (
      <section className="py-48 px-8 md:px-24 bg-[#0a0a0a]">
        <div className="max-w-screen-xl mx-auto grid md:grid-cols-12 gap-12">
          <div className="md:col-span-4">
            <span className="text-[0.6rem] font-bold tracking-[1em] text-stone-600 uppercase">The Agency</span>
          </div>
          <div className="md:col-span-8">
            <p className="text-2xl md:text-5xl font-light leading-snug tracking-tight text-stone-300">
              Transformamos marcas de alto valor a través de <span className="text-white italic font-normal">estética computacional</span> y algoritmos de deseo. No hacemos marketing; diseñamos el futuro de la percepción.
            </p>
          </div>
        </div>
      </section>
    );

    // --- Component: Footer ---
    const Footer = () => (
      <footer className="bg-black py-24 px-8 md:px-24 border-t border-white/5">
        <div className="max-w-screen-2xl mx-auto flex flex-col md:flex-row justify-between items-end gap-12">
          <div>
            <h4 className="text-4xl font-black tracking-tighter uppercase mb-8">Ready to <br/>ascend?</h4>
            <p className="text-stone-600 text-[0.6rem] tracking-[0.5em] uppercase">Private inquiry only.</p>
          </div>
          <div className="text-right">
            <span className="text-[0.5rem] tracking-[1em] text-stone-700 uppercase">Aether AI &copy; 2025 // All rights reserved</span>
          </div>
        </div>
      </footer>
    );

    // --- Main App ---
    const App = () => {
      const [isLoaded, setIsLoaded] = useState(false);
      useEffect(() => {
        setTimeout(() => setIsLoaded(true), 1500);
      }, []);

      return (
        <div className="bg-[#0a0a0a]">
          <div className="cinematic-frame"></div>
          
          <AnimatePresence>
            {!isLoaded && (
              <motion.div 
                exit={{ opacity: 0 }} 
                className="fixed inset-0 z-[200] bg-black flex items-center justify-center"
              >
                <span className="text-[0.5rem] tracking-[2em] uppercase animate-pulse">Aether</span>
              </motion.div>
            )}
          </AnimatePresence>

          <Navbar />
          <Hero />
          <AboutSection />
          
          <PortfolioSection 
            title="VISUAL CORE" 
            subtitle="Identidades generadas por redes neuronales profundas." 
            imageUrl="https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2000"
            reversed={false}
          />
          <PortfolioSection 
            title="NEURAL SCALE" 
            subtitle="Estrategias de crecimiento que aprenden del mercado." 
            imageUrl="https://images.unsplash.com/photo-1497366811353-6870744d04b2?q=80&w=2000"
            reversed={true}
          />
          <PortfolioSection 
            title="LUXURY DATA" 
            subtitle="Análisis predictivo para audiencias de ultra-lujo." 
            imageUrl="https://images.unsplash.com/photo-1497366754035-f200968a6e72?q=80&w=2000"
            reversed={false}
          />

          <Footer />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
