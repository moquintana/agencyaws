<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principios de Liderazgo - Versión Tarjetas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .search-box {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .card-number {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .card-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .card-info {
            font-size: 0.9em;
            color: #666;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .modal-content {
            background: white;
            max-width: 900px;
            margin: 50px auto;
            border-radius: 20px;
            padding: 40px;
            position: relative;
        }
        
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #999;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .close:hover {
            color: #333;
        }
        
        .modal-header {
            margin-bottom: 30px;
        }
        
        .modal-title {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
        }
        
        .caso {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        
        .caso-header {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .star-label {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .star-content {
            color: #333;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        @media print {
            body {
                background: white;
            }
            .modal {
                display: none !important;
            }
            .card {
                page-break-inside: avoid;
            }
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .modal-content {
                margin: 20px;
                padding: 20px;
            }
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Principios de Liderazgo</h1>
            <p>Haz clic en cualquier principio para ver los casos STAR</p>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Buscar principio..." onkeyup="filtrarPrincipios()">
        </div>
        
        <div class="grid" id="principiosGrid"></div>
    </div>
    
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

        function renderPrincipios() {
            const grid = document.getElementById('principiosGrid');
            grid.innerHTML = '';
            
            principios.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => abrirModal(p);
                
                card.innerHTML = `
                    <div class="card-number">${p.numero}</div>
                    <div class="card-title">${p.nombre}</div>
                    <div class="card-info">${p.casos.length} caso${p.casos.length > 1 ? 's' : ''} STAR</div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        function abrirModal(principio) {
            const modal = document.getElementById('modal');
            const modalBody = document.getElementById('modalBody');
            
            let casosHTML = '';
            principio.casos.forEach((caso, index) => {
                casosHTML += `
                    <div class="caso">
                        ${principio.casos.length > 1 ? `<div class="caso-header">Caso ${index + 1}</div>` : ''}
                        <div class="star-label">📍 SITUATION</div>
                        <div class="star-content">${caso.situation}</div>
                        
                        <div class="star-label">🎯 TASK</div>
                        <div class="star-content">${caso.task}</div>
                        
                        <div class="star-label">⚡ ACTION</div>
                        <div class="star-content">${caso.action.replace(/\n/g, '<br>')}</div>
                        
                        <div class="star-label">🏆 RESULTS</div>
                        <div class="star-content">${caso.results.replace(/\n/g, '<br>')}</div>
                    </div>
                `;
            });
            
            modalBody.innerHTML = `
                <div class="modal-header">
                    <div class="card-number" style="display: inline-block; margin-right: 15px;">${principio.numero}</div>
                    <div class="modal-title" style="display: inline-block;">${principio.nombre}</div>
                </div>
                ${casosHTML}
            `;
            
            modal.style.display = 'block';
        }
        
        function cerrarModal() {
            document.getElementById('modal').style.display = 'none';
        }
        
        function filtrarPrincipios() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(input) ? 'block' : 'none';
            });
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target == modal) {
                cerrarModal();
            }
        }
        
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                cerrarModal();
            }
        });
        
        renderPrincipios();
    </script>
</body>
</html>
